[package]
name = "markdownx-server"
version = "0.1.14"
edition = "2024"
license = "MIT"
description = "MarkdownX collaboration server: WebSocket editing, Git history, diffs and restore"
publish = false

[[bin]]
name = "markdownx-server"
path = "src/main.rs"

[dependencies]
fdl_core = { path = "../crates/core" }
anyhow = "1.0.104"
axum = { version = "0.8", features = ["ws"] }
futures-util = "0.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
subtle = "2.6"
tokio = { version = "1.48", features = ["full"] }
tower-http = { version = "0.6", features = ["fs", "trace", "cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.28", features = ["v4"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
