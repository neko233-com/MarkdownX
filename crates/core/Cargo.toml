# The document engine: model, DocxXML, the editing core, the library on
# disk, import and export. No GPUI, so it builds and tests on its own.
[package]
name = "fdl_core"
version = "0.1.18"
edition = "2024"
description = "The document engine behind MarkdownX: model, DocxXML and Markdown interchange, editing core, interactive books"
license = "MIT"
readme = "../../README.md"
authors = ["neko233-com"]

[dependencies]
anyhow = "1.0.104"
base64 = "0.22"
dirs = "7.0.0"
quick-xml = "0.37"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
unicode-segmentation = "1.13.3"
uuid = { version = "1.28.0", features = ["v4"] }
rustc-hash = "2.1"
html5ever = "0.27"
markup5ever_rcdom = "0.3"
calamine = "0.36.1"
chrono = { version = "0.4", default-features = false, features = ["std"] }
regex = "1.13.1"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
ironcalc = "=0.9.1"
symphonia = { version = "0.5.4", default-features = false, features = ["aac", "flac", "isomp4", "mp3", "ogg", "pcm", "vorbis", "wav"] }

# A tiny reference extension: the integration tests launch it and it also
# documents the JSON-RPC lifecycle for plugin authors.
[[bin]]
name = "mdx-plugin-fixture"
path = "src/bin/mdx_plugin_fixture.rs"

[lints]
workspace = true
