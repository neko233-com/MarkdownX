name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to release, for example v0.1.47
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
  CGO_ENABLED: '0'

jobs:
  windows:
    name: Windows x64
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Check tag matches mygo.json
        run: |
          set -euo pipefail
          version="$(python3 -c "import json; print(json.load(open('mygo.json'))['version'])")"
          test "v${version}" = "${RELEASE_TAG}"

      - name: Install NSIS
        run: |
          sudo apt-get update
          sudo apt-get install -y nsis

      - name: Build desktop app and installer
        run: go tool mygo build -platform windows/amd64 -o out/mygo

      - name: Build command-line tools
        env:
          GOOS: windows
          GOARCH: amd64
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/cli
          for pair in "markdownx-server:markdownx-server" "markdownx-convert:mdx-convert" "mdx-enc:mdx-enc"; do
            dir="${pair%%:*}"
            name="${pair##*:}"
            go build -trimpath -ldflags "-s -w" -o "out/cli/${name}.exe" "./cmd/${dir}"
          done
          cp README.md README-CN.md LICENSE out/cli/
          (cd out/cli && zip -q -r "../markdownx-cli-${RELEASE_TAG}-windows-amd64.zip" .)

      - name: Collect release assets
        run: |
          set -euo pipefail
          mkdir -p out/release
          cp out/mygo/windows-amd64/markdownx-setup-*.exe out/release/
          cp out/mygo/windows-amd64/MarkdownX.exe out/release/
          cp out/markdownx-cli-*.zip out/release/
          (cd out/release && sha256sum ./* > SHA256SUMS-windows-x64)

      - uses: actions/upload-artifact@v4
        with:
          name: release-windows-x64
          path: out/release/*
          if-no-files-found: error

  macos:
    name: macOS arm64
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Check tag matches mygo.json
        run: |
          set -euo pipefail
          version="$(python3 -c "import json; print(json.load(open('mygo.json'))['version'])")"
          test "v${version}" = "${RELEASE_TAG}"

      - name: Build desktop app and disk image
        run: go tool mygo build -platform darwin/arm64 -o out/mygo

      - name: Build command-line tools
        env:
          GOOS: darwin
          GOARCH: arm64
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/cli
          for pair in "markdownx-server:markdownx-server" "markdownx-convert:mdx-convert" "mdx-enc:mdx-enc"; do
            dir="${pair%%:*}"
            name="${pair##*:}"
            go build -trimpath -ldflags "-s -w" -o "out/cli/${name}" "./cmd/${dir}"
          done
          cp README.md README-CN.md LICENSE out/cli/
          tar -czf "out/markdownx-cli-${RELEASE_TAG}-darwin-arm64.tar.gz" -C out/cli .

      - name: Collect release assets
        run: |
          set -euo pipefail
          mkdir -p out/release
          cp out/mygo/darwin-arm64/*.dmg out/release/
          cp out/markdownx-cli-*.tar.gz out/release/
          (cd out/release && shasum -a 256 ./* > SHA256SUMS-macos-arm64)

      - uses: actions/upload-artifact@v4
        with:
          name: release-macos-arm64
          path: out/release/*
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: [windows, macos]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - name: Combine checksums
        run: |
          set -euo pipefail
          cat out/SHA256SUMS-windows-x64 out/SHA256SUMS-macos-arm64 > out/SHA256SUMS
          rm out/SHA256SUMS-windows-x64 out/SHA256SUMS-macos-arm64
          ls -lh out

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: MarkdownX ${{ env.RELEASE_TAG }}
          files: out/*
          fail_on_unmatched_files: true
          generate_release_notes: true
