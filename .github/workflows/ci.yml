name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CGO_ENABLED: '0'

jobs:
  test:
    name: vet + test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Vet
        run: go vet ./...

      - name: Test (no cgo)
        run: go test ./...

  package-windows:
    name: Windows x64 package
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install NSIS
        run: |
          sudo apt-get update
          sudo apt-get install -y nsis

      - name: Build with MyGo
        run: go tool mygo build -platform windows/amd64 -o build

      - name: Build command-line tools
        env:
          GOOS: windows
          GOARCH: amd64
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/cli
          for pair in "markdownx-server:markdownx-server" "markdownx-convert:mdx-convert" "mdx-enc:mdx-enc"; do
            dir="${pair%%:*}"
            name="${pair##*:}"
            go build -trimpath -ldflags "-s -w" -o "build/cli/${name}.exe" "./cmd/${dir}"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: markdownx-windows-amd64
          path: build/*
          if-no-files-found: error
          retention-days: 7

  package-macos:
    name: macOS arm64 package
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build with MyGo
        run: go tool mygo build -platform darwin/arm64 -o build

      - name: Build command-line tools
        env:
          GOOS: darwin
          GOARCH: arm64
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/cli
          for pair in "markdownx-server:markdownx-server" "markdownx-convert:mdx-convert" "mdx-enc:mdx-enc"; do
            dir="${pair%%:*}"
            name="${pair##*:}"
            go build -trimpath -ldflags "-s -w" -o "build/cli/${name}" "./cmd/${dir}"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: markdownx-darwin-arm64
          path: build/*
          if-no-files-found: error
          retention-days: 7
